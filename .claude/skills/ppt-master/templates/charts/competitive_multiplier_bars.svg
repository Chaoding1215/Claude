<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Competitive Multiplier Bars Template
    Usage: pairwise performance comparison where the headline message is a ratio, not the raw values
    Scenarios: benchmark reports, competitive positioning, "Nx faster/better" claims
    Supports: 3 metric pairs (own product vs competitor)
    -->
    <defs>
        <linearGradient id="ownBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1"/>
        </linearGradient>
        <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="2" result="offsetBlur"/>
            <feFlood flood-color="#0F172A" flood-opacity="0.12" result="shadowColor"/>
            <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
            <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header">
        <text x="60" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="34" font-weight="bold" fill="#0F172A"><tspan>Performance Leadership vs. Competitor</tspan></text>
        <text x="60" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="14" fill="#64748B"><tspan>Independent third-party benchmark, same test conditions</tspan></text>
    </g>

    <g id="chartArea">
        <line x1="140" y1="600" x2="1180" y2="600" stroke="#94A3B8" stroke-width="2"/>
        <!-- chart-plot-area: 140,180,1180,600 -->

        <g id="metric-pair-1">
            <rect x="230" y="520" width="90" height="80" fill="#E2E8F0"/>
            <text x="275" y="512" text-anchor="middle" font-size="14" fill="#64748B"><tspan>Competitor</tspan></text>
            <rect x="330" y="420" width="90" height="180" fill="url(#ownBarGrad)"/>
            <rect x="330" y="360" width="90" height="42" rx="21" fill="#2563EB" filter="url(#badgeShadow)"/>
            <text x="375" y="388" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF"><tspan>2x</tspan></text>
            <text x="330" y="640" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A"><tspan>Baseline</tspan></text>
            <text x="330" y="662" text-anchor="middle" font-size="14" fill="#64748B"><tspan>Throughput (IMIX)</tspan></text>
        </g>

        <g id="metric-pair-2">
            <rect x="560" y="520" width="90" height="80" fill="#E2E8F0"/>
            <text x="605" y="512" text-anchor="middle" font-size="14" fill="#64748B"><tspan>Competitor</tspan></text>
            <rect x="660" y="340" width="90" height="260" fill="url(#ownBarGrad)"/>
            <rect x="660" y="280" width="90" height="42" rx="21" fill="#2563EB" filter="url(#badgeShadow)"/>
            <text x="705" y="308" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF"><tspan>4x</tspan></text>
            <text x="660" y="640" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A"><tspan>With Security</tspan></text>
            <text x="660" y="662" text-anchor="middle" font-size="14" fill="#64748B"><tspan>IPSec performance</tspan></text>
        </g>

        <g id="metric-pair-3">
            <rect x="890" y="520" width="90" height="80" fill="#E2E8F0"/>
            <text x="935" y="512" text-anchor="middle" font-size="14" fill="#64748B"><tspan>Competitor</tspan></text>
            <rect x="990" y="300" width="90" height="300" fill="url(#ownBarGrad)"/>
            <rect x="990" y="240" width="90" height="42" rx="21" fill="#2563EB" filter="url(#badgeShadow)"/>
            <text x="1035" y="268" text-anchor="middle" font-size="20" font-weight="bold" fill="#FFFFFF"><tspan>5x</tspan></text>
            <text x="990" y="640" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A"><tspan>Full Workload</tspan></text>
            <text x="990" y="662" text-anchor="middle" font-size="14" fill="#64748B"><tspan>Business + QoS + NAT</tspan></text>
        </g>
    </g>

    <g id="legend">
        <rect x="1060" y="360" width="20" height="14" fill="#E2E8F0"/>
        <text x="1088" y="371" font-size="14" fill="#475569"><tspan>Competitor</tspan></text>
        <rect x="1060" y="386" width="20" height="14" fill="url(#ownBarGrad)"/>
        <text x="1088" y="397" font-size="14" fill="#475569"><tspan>Our Product</tspan></text>
    </g>

    <text x="60" y="695" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#94A3B8">
        <tspan>Data source: Independent lab benchmark, same-tier hardware configuration</tspan>
    </text>
</svg>
