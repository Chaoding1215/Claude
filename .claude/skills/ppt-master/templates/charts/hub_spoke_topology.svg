<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
    <!--
    Hub-Spoke Topology Template
    Usage: technical/network architecture diagram, one hub node wired to labeled endpoint nodes
    Scenarios: network topology, system architecture, physical/logical wiring diagrams
    Distinct from hub_spoke.svg: this is a literal technical diagram with labeled connectors,
    not an abstract capability-radiating diagram.
    Supports: 1 hub + 4 endpoint nodes, each connector individually labeled
    -->
    <defs>
        <linearGradient id="hubNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3B82F6"/>
            <stop offset="100%" stop-color="#2563EB"/>
        </linearGradient>
    </defs>
    <rect width="1280" height="720" fill="#FFFFFF"/>

    <g id="header">
        <text x="60" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="34" font-weight="bold" fill="#0F172A"><tspan>System Architecture Overview</tspan></text>
        <text x="60" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
              font-size="14" fill="#64748B"><tspan>Central controller wired to site endpoints, one link per function</tspan></text>
    </g>

    <g id="context-panel">
        <text x="60" y="150" font-size="16" fill="#334155"><tspan>Single-fiber, multi-service connectivity replaces per-function cabling</tspan></text>
    </g>

    <g id="topology-hub">
        <circle cx="640" cy="400" r="60" fill="url(#hubNodeGrad)"/>
        <text x="640" y="395" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF"><tspan>Central</tspan></text>
        <text x="640" y="414" text-anchor="middle" font-size="15" font-weight="600" fill="#FFFFFF"><tspan>Controller</tspan></text>
    </g>

    <g id="topology-node-1">
        <line x1="640" y1="340" x2="640" y2="220" stroke="#94A3B8" stroke-width="2"/>
        <rect x="555" y="185" width="170" height="70" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="640" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A"><tspan>Guest Zone</tspan></text>
        <text x="640" y="233" text-anchor="middle" font-size="12" fill="#64748B"><tspan>Wi-Fi access point</tspan></text>
        <rect x="580" y="270" width="120" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="640" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#475569"><tspan>Link: Fiber A</tspan></text>
    </g>

    <g id="topology-node-2">
        <line x1="700" y1="400" x2="920" y2="400" stroke="#94A3B8" stroke-width="2"/>
        <rect x="920" y="365" width="170" height="70" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="1005" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A"><tspan>Lobby / Corridor</tspan></text>
        <text x="1005" y="413" text-anchor="middle" font-size="12" fill="#64748B"><tspan>IP camera + display</tspan></text>
        <rect x="795" y="410" width="120" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="855" y="426" text-anchor="middle" font-size="12" font-weight="600" fill="#475569"><tspan>Link: Splitter B</tspan></text>
    </g>

    <g id="topology-node-3">
        <line x1="640" y1="460" x2="640" y2="580" stroke="#94A3B8" stroke-width="2"/>
        <rect x="555" y="580" width="170" height="70" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="640" y="607" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A"><tspan>Meeting Room</tspan></text>
        <text x="640" y="628" text-anchor="middle" font-size="12" fill="#64748B"><tspan>Video conferencing</tspan></text>
        <rect x="580" y="500" width="120" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="640" y="516" text-anchor="middle" font-size="12" font-weight="600" fill="#475569"><tspan>Link: Fiber C</tspan></text>
    </g>

    <g id="topology-node-4">
        <line x1="580" y1="400" x2="360" y2="400" stroke="#94A3B8" stroke-width="2"/>
        <rect x="190" y="365" width="170" height="70" fill="#EFF6FF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="275" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A"><tspan>Security Ops</tspan></text>
        <text x="275" y="413" text-anchor="middle" font-size="12" fill="#64748B"><tspan>NVR + access control</tspan></text>
        <rect x="385" y="410" width="120" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
        <text x="445" y="426" text-anchor="middle" font-size="12" font-weight="600" fill="#475569"><tspan>Link: Splitter D</tspan></text>
    </g>

    <g id="results-panel">
        <rect x="960" y="500" width="220" height="150" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
        <text x="1070" y="530" text-anchor="middle" font-size="16" font-weight="600" fill="#059669"><tspan>Outcome</tspan></text>
        <text x="1070" y="560" text-anchor="middle" font-size="14" fill="#334155"><tspan>One fiber, four services</tspan></text>
        <text x="1070" y="582" text-anchor="middle" font-size="14" fill="#334155"><tspan>Unified install and O&amp;M</tspan></text>
    </g>

    <text x="60" y="695" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#94A3B8">
        <tspan>Data source: Reference architecture, deployment guide</tspan>
    </text>
</svg>
