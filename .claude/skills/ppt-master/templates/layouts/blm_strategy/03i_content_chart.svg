<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <g id="background">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="64" y="70" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#0070C0">{{PAGE_TITLE}}</text>
  </g>

  <g id="content-chart-frame">
    <rect x="64" y="110" width="1152" height="500" fill="#FBFCFD" stroke="#D4EAF5" stroke-width="1.5" rx="4"/>
    <line x1="120" y1="150" x2="120" y2="570" stroke="#595959" stroke-width="1.5"/>
    <line x1="120" y1="570" x2="1160" y2="570" stroke="#595959" stroke-width="1.5"/>
    <line x1="120" y1="470" x2="1160" y2="470" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="120" y1="370" x2="1160" y2="370" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="120" y1="270" x2="1160" y2="270" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="2,2"/>
    <polyline points="160,520 320,440 480,480 640,320 800,360 960,240 1120,280" fill="none" stroke="#0070C0" stroke-width="2" stroke-opacity="0.35" stroke-linejoin="round"/>
    <text x="640" y="600" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#CBD5E1">{{CHART_AREA}}</text>
  </g>

  <g id="footer">
    <rect x="0" y="660" width="1280" height="48" fill="#0070C0"/>
    <text x="640" y="690" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">{{KEY_MESSAGE}}</text>
  </g>
</svg>
