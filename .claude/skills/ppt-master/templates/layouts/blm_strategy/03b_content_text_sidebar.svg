<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <g id="background">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="64" y="70" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#002060">{{PAGE_TITLE}}</text>
  </g>

  <g id="content-main-text">
    <text x="64" y="130" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#C00000">{{SECTION_NAME}}</text>
    <text x="64" y="176" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#000000">{{CONTENT_AREA}}</text>
    <text x="64" y="230" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#000000">{{CONTENT_AREA}}</text>
    <text x="64" y="284" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" fill="#000000">{{CONTENT_AREA}}</text>
    <rect x="64" y="520" width="750" height="66" fill="none" stroke="#0070C0" stroke-width="1.5" rx="4"/>
    <text x="88" y="560" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="17" font-weight="bold" fill="#0000FF">{{KEY_MESSAGE}}</text>
  </g>

  <g id="content-sidebar-callout">
    <rect x="850" y="110" width="366" height="500" fill="#D4EAF5" rx="6"/>
    <text x="878" y="152" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" font-weight="bold" fill="#002060">{{SIDEBAR_TITLE}}</text>
    <text x="878" y="196" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#333333">{{SIDEBAR_BODY}}</text>
    <text x="878" y="250" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#333333">{{SIDEBAR_BODY}}</text>
  </g>

  <g id="footer">
    <rect x="0" y="660" width="1280" height="48" fill="#0070C0"/>
    <text x="640" y="690" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">{{SECTION_NAME}}</text>
  </g>
</svg>
