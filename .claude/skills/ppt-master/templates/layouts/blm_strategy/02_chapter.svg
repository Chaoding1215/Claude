<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <g id="background">
    <rect width="1280" height="720" fill="#0070C0"/>
  </g>

  <g id="chapter-heading">
    <text x="120" y="320" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="120" font-weight="bold" fill="#FFFFFF" fill-opacity="0.28">{{CHAPTER_NUM}}</text>
    <rect x="120" y="360" width="80" height="6" fill="#BBE0E3"/>
    <text x="120" y="440" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF">{{CHAPTER_TITLE}}</text>
    <text x="120" y="484" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#D4EAF5">{{CHAPTER_DESC}}</text>
  </g>

  <g id="decoration">
    <line x1="0" y1="700" x2="1280" y2="700" stroke="#BBE0E3" stroke-opacity="0.4" stroke-width="1"/>
  </g>
</svg>
