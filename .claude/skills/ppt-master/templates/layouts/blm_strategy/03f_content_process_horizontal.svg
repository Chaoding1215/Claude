<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <g id="background">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="64" y="70" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#0070C0">{{PAGE_TITLE}}</text>
  </g>

  <g id="content-phase-1">
    <circle cx="184" cy="180" r="18" fill="#0070C0"/>
    <text x="184" y="187" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
    <rect x="64" y="220" width="240" height="140" fill="#D4EAF5" rx="6"/>
    <text x="184" y="270" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#002060">{{PHASE_N_LABEL}}</text>
    <text x="184" y="310" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{PHASE_N_DESC}}</text>
  </g>

  <g id="decoration-arrow-1">
    <polygon points="316,290 350,290 350,278 372,300 350,322 350,310 316,310" fill="#BBE0E3"/>
  </g>

  <g id="content-phase-2">
    <circle cx="488" cy="180" r="18" fill="#0070C0"/>
    <text x="488" y="187" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
    <rect x="368" y="220" width="240" height="140" fill="#D4EAF5" rx="6"/>
    <text x="488" y="270" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#002060">{{PHASE_N_LABEL}}</text>
    <text x="488" y="310" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{PHASE_N_DESC}}</text>
  </g>

  <g id="decoration-arrow-2">
    <polygon points="620,290 654,290 654,278 676,300 654,322 654,310 620,310" fill="#BBE0E3"/>
  </g>

  <g id="content-phase-3">
    <circle cx="792" cy="180" r="18" fill="#0070C0"/>
    <text x="792" y="187" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">3</text>
    <rect x="672" y="220" width="240" height="140" fill="#D4EAF5" rx="6"/>
    <text x="792" y="270" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#002060">{{PHASE_N_LABEL}}</text>
    <text x="792" y="310" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{PHASE_N_DESC}}</text>
  </g>

  <g id="decoration-arrow-3">
    <polygon points="924,290 958,290 958,278 980,300 958,322 958,310 924,310" fill="#BBE0E3"/>
  </g>

  <g id="content-phase-4">
    <circle cx="1096" cy="180" r="18" fill="#C00000"/>
    <text x="1096" y="187" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">4</text>
    <rect x="976" y="220" width="240" height="140" fill="#F9D6D6" rx="6"/>
    <text x="1096" y="270" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#C00000">{{PHASE_N_LABEL}}</text>
    <text x="1096" y="310" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{PHASE_N_DESC}}</text>
  </g>

  <g id="content-detail-strip">
    <line x1="64" y1="400" x2="1216" y2="400" stroke="#E5E5E5" stroke-width="1"/>
    <text x="64" y="450" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#000000">{{CONTENT_AREA}}</text>
    <text x="64" y="490" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#000000">{{CONTENT_AREA}}</text>
  </g>

  <g id="footer">
    <rect x="0" y="660" width="1280" height="48" fill="#0070C0"/>
    <text x="640" y="690" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">{{KEY_MESSAGE}}</text>
  </g>
</svg>
