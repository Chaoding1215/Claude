<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <g id="background">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="64" y="70" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#0070C0">{{PAGE_TITLE}}</text>
  </g>

  <g id="content-numbered-list">
    <line x1="98" y1="140" x2="98" y2="580" stroke="#BBE0E3" stroke-width="2"/>

    <circle cx="98" cy="140" r="20" fill="#C00000"/>
    <text x="98" y="147" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1</text>
    <text x="136" y="135" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" font-weight="bold" fill="#002060">{{LIST_ITEM_N_TITLE}}</text>
    <text x="136" y="164" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{LIST_ITEM_N_DESC}}</text>

    <circle cx="98" cy="250" r="20" fill="#C00000"/>
    <text x="98" y="257" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="136" y="245" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" font-weight="bold" fill="#002060">{{LIST_ITEM_N_TITLE}}</text>
    <text x="136" y="274" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{LIST_ITEM_N_DESC}}</text>

    <circle cx="98" cy="360" r="20" fill="#C00000"/>
    <text x="98" y="367" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">3</text>
    <text x="136" y="355" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" font-weight="bold" fill="#002060">{{LIST_ITEM_N_TITLE}}</text>
    <text x="136" y="384" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{LIST_ITEM_N_DESC}}</text>

    <circle cx="98" cy="470" r="20" fill="#C00000"/>
    <text x="98" y="477" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">4</text>
    <text x="136" y="465" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" font-weight="bold" fill="#002060">{{LIST_ITEM_N_TITLE}}</text>
    <text x="136" y="494" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{LIST_ITEM_N_DESC}}</text>
  </g>

  <g id="content-side-image">
    <rect x="660" y="110" width="556" height="500" fill="#F5F7FA" stroke="#D4EAF5" stroke-width="1.5" stroke-dasharray="8,4" rx="6"/>
    <text x="938" y="365" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#CBD5E1">{{IMAGE}}</text>
  </g>

  <g id="footer">
    <rect x="0" y="660" width="1280" height="48" fill="#0070C0"/>
    <text x="640" y="690" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">{{KEY_MESSAGE}}</text>
  </g>
</svg>
