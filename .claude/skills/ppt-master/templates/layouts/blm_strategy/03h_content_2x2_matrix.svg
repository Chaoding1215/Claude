<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <defs>
    <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333333"/>
    </marker>
  </defs>

  <g id="background">
    <rect width="1280" height="720" fill="#FFFFFF"/>
  </g>

  <g id="header">
    <text x="64" y="70" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" font-weight="bold" fill="#0070C0">{{PAGE_TITLE}}</text>
  </g>

  <g id="content-quadrants">
    <rect x="64" y="140" width="576" height="240" fill="#FBEAEA"/>
    <rect x="640" y="140" width="576" height="240" fill="#E6F0FA"/>
    <rect x="64" y="380" width="576" height="240" fill="#F0F0F0"/>
    <rect x="640" y="380" width="576" height="240" fill="#E0F5F6"/>

    <text x="352" y="264" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#C00000">{{QUADRANT_1_LABEL}}</text>
    <text x="928" y="264" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#0070C0">{{QUADRANT_2_LABEL}}</text>
    <text x="352" y="504" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#595959">{{QUADRANT_3_LABEL}}</text>
    <text x="928" y="504" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#239DC4">{{QUADRANT_4_LABEL}}</text>
  </g>

  <g id="content-axes">
    <line x1="64" y1="380" x2="1206" y2="380" stroke="#333333" stroke-width="2" marker-end="url(#axisArrow)"/>
    <line x1="640" y1="620" x2="640" y2="150" stroke="#333333" stroke-width="2" marker-end="url(#axisArrow)"/>
    <text x="1160" y="404" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="bold" fill="#333333">{{AXIS_X_LABEL}}</text>
    <text x="640" y="134" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" font-weight="bold" fill="#333333">{{AXIS_Y_LABEL}}</text>
  </g>

  <g id="footer">
    <rect x="0" y="660" width="1280" height="48" fill="#0070C0"/>
    <text x="640" y="690" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">{{KEY_MESSAGE}}</text>
  </g>
</svg>
