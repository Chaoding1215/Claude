    <rect x="64" y="174" width="262" height="130" fill="#EAEAEA" stroke="#B0B0B0" stroke-width="1" rx="4"/>
    <text x="195" y="244" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{NODE_LABEL}}</text>
    <rect x="346" y="174" width="262" height="130" fill="#EAEAEA" stroke="#B0B0B0" stroke-width="1" rx="4"/>
    <text x="477" y="244" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{NODE_LABEL}}</text>
    <rect x="64" y="324" width="262" height="130" fill="#EAEAEA" stroke="#B0B0B0" stroke-width="1" rx="4"/>
    <text x="195" y="394" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{NODE_LABEL}}</text>
    <rect x="346" y="324" width="262" height="130" fill="#EAEAEA" stroke="#B0B0B0" stroke-width="1" rx="4"/>
    <text x="477" y="394" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{NODE_LABEL}}</text>
  </g>

  <g id="content-group-right">
    <rect x="672" y="110" width="544" height="44" fill="#333399" rx="4"/>
    <text x="944" y="139" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">{{GROUP_2_LABEL}}</text>

    <rect x="672" y="174" width="262" height="130" fill="#EAEAEA" stroke="#B0B0B0" stroke-width="1" rx="4"/>
    <text x="803" y="244" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{NODE_LABEL}}</text>
    <rect x="954" y="174" width="262" height="130" fill="#EAEAEA" stroke="#B0B0B0" stroke-width="1" rx="4"/>
    <text x="1085" y="244" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{NODE_LABEL}}</text>
    <rect x="672" y="324" width="262" height="130" fill="#EAEAEA" stroke="#B0B0B0" stroke-width="1" rx="4"/>
    <text x="803" y="394" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{NODE_LABEL}}</text>
    <rect x="954" y="324" width="262" height="130" fill="#EAEAEA" stroke="#B0B0B0" stroke-width="1" rx="4"/>
