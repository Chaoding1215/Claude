  </g>

  <g id="content-convergence">
    <line x1="326" y1="420" x2="600" y2="470" stroke="#F47216" stroke-width="2" marker-end="url(#hierArrowOrange)"/>
    <line x1="954" y1="420" x2="680" y2="470" stroke="#F47216" stroke-width="2" marker-end="url(#hierArrowOrange)"/>
    <rect x="580" y="470" width="120" height="56" fill="#FFFFFF" stroke="#C00000" stroke-width="2" rx="6"/>
    <text x="640" y="504" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="bold" fill="#C00000">{{GAP_LABEL}}</text>
    <line x1="640" y1="526" x2="640" y2="562" stroke="#595959" stroke-width="2" marker-end="url(#hierArrowGray)"/>
    <ellipse cx="640" cy="600" rx="150" ry="38" fill="#D9D9D9" stroke="#595959" stroke-width="1.5"/>
    <text x="640" y="606" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" font-weight="bold" fill="#333333">{{RESULT_LABEL}}</text>
