<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
<g id="background">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
</g>
<g id="header">
<text x="88" y="90" text-anchor="start" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="32" fill="#1D1D1A" font-weight="bold">{{PAGE_TITLE}}</text>
<rect x="1158" y="0" width="122" height="29" fill="#A3A3A3"/>
<text x="1219" y="21" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">{{SECTION_NAME}}</text>
</g>
<g id="subtitle">
<text x="88" y="135" text-anchor="start" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#666666">{{KEY_MESSAGE}}</text>
</g>
<g id="benchmark-chart-bars">
<rect x="180" y="480" width="80" height="80" fill="#DEDEDE"/>
<text x="220" y="475" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#666666">{{CONTENT_AREA}}</text>
<rect x="300" y="380" width="80" height="180" fill="#C00000"/>
<text x="340" y="368" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#C00000" font-weight="bold">2x</text>
<rect x="470" y="480" width="80" height="80" fill="#DEDEDE"/>
<text x="510" y="475" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#666666">{{CONTENT_AREA}}</text>
<rect x="590" y="300" width="80" height="260" fill="#C00000"/>
<text x="630" y="288" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#C00000" font-weight="bold">4x</text>
<rect x="760" y="480" width="80" height="80" fill="#DEDEDE"/>
<text x="800" y="475" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#666666">{{CONTENT_AREA}}</text>
<rect x="880" y="260" width="80" height="300" fill="#C00000"/>
<text x="920" y="248" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="20" fill="#C00000" font-weight="bold">5x</text>
<line x1="150" y1="560" x2="1040" y2="560" stroke="#1D1D1A" stroke-width="1.5"/>
</g>
<g id="benchmark-legend">
<rect x="1060" y="380" width="180" height="180" rx="6" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
<text x="1150" y="410" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333" font-weight="bold">{{SOURCE}}</text>
<text x="1150" y="440" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="12" fill="#666666">{{CONTENT_AREA}}</text>
</g>
</svg>
