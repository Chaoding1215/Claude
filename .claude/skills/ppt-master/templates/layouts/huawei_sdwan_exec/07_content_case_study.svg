<text x="640" y="505" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{CONTENT_AREA}}</text>
</g>
<g id="case-stat-3">
<text x="1060" y="470" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="40" fill="#C00000" font-weight="bold">{{KEY_MESSAGE}}</text>
<text x="1060" y="505" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#333333">{{CONTENT_AREA}}</text>
