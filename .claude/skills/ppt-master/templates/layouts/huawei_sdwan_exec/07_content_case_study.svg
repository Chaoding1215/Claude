<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
<g id="background">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
</g>
<g id="header">
<text x="88" y="90" text-anchor="start" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" fill="#1D1D1A" font-weight="bold">{{PAGE_TITLE}}</text>
<rect x="1158" y="0" width="122" height="29" fill="#A3A3A3"/>
<text x="1219" y="21" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">{{SECTION_NAME}}</text>
</g>
<g id="case-before-panel">
<rect x="88" y="140" width="500" height="240" rx="6" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
<text x="338" y="175" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#666666" font-weight="bold">{{SECTION_NAME}}</text>
