<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
<g id="background">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
</g>
<g id="header">
<text x="88" y="90" text-anchor="start" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="30" fill="#1D1D1A" font-weight="bold">{{PAGE_TITLE}}</text>
<rect x="1158" y="0" width="122" height="29" fill="#A3A3A3"/>
<text x="1219" y="21" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">{{SECTION_NAME}}</text>
</g>
<g id="timeline-axis">
<line x1="120" y1="330" x2="1160" y2="330" stroke="#DEDEDE" stroke-width="3"/>
</g>
<g id="timeline-milestone-1">
<circle cx="200" cy="330" r="7" fill="#C00000"/>
<text x="200" y="300" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1D1D1A" font-weight="bold">{{DATE}}</text>
<text x="200" y="370" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{CONTENT_AREA}}</text>
</g>
<g id="timeline-milestone-2">
<circle cx="440" cy="330" r="7" fill="#C00000"/>
<text x="440" y="300" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1D1D1A" font-weight="bold">{{DATE}}</text>
<text x="440" y="370" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{CONTENT_AREA}}</text>
</g>
<g id="timeline-milestone-3">
<circle cx="680" cy="330" r="7" fill="#C00000"/>
<text x="680" y="300" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1D1D1A" font-weight="bold">{{DATE}}</text>
<text x="680" y="370" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{CONTENT_AREA}}</text>
</g>
<g id="timeline-milestone-4">
<circle cx="920" cy="330" r="7" fill="#C00000"/>
<text x="920" y="300" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#1D1D1A" font-weight="bold">{{DATE}}</text>
<text x="920" y="370" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{CONTENT_AREA}}</text>
</g>
<g id="timeline-milestone-5">
<circle cx="1120" cy="330" r="9" fill="#C00000" stroke="#FFFFFF" stroke-width="2"/>
<text x="1120" y="300" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#C00000" font-weight="bold">{{DATE}}</text>
<text x="1120" y="370" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333" font-weight="bold">{{CONTENT_AREA}}</text>
</g>
<g id="timeline-icon-row">
<rect x="120" y="450" width="1040" height="160" rx="6" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1"/>
<text x="640" y="535" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#666666">{{CONTENT_AREA}}</text>
</g>
</svg>
