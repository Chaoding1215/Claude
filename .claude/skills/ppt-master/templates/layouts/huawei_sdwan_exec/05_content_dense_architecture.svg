<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
<g id="background">
<rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
</g>
<g id="header">
<text x="88" y="90" text-anchor="start" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="32" fill="#1D1D1A" font-weight="bold">{{PAGE_TITLE}}</text>
<rect x="1158" y="0" width="122" height="29" fill="#A3A3A3"/>
<text x="1219" y="21" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="19" fill="#FFFFFF" font-weight="bold">{{SECTION_NAME}}</text>
</g>
<g id="context-panel">
<text x="88" y="135" text-anchor="start" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="18" fill="#666666">{{KEY_MESSAGE}}</text>
</g>
<g id="architecture-diagram-hub">
<circle cx="640" cy="380" r="46" fill="#F5F5F5" stroke="#C00000" stroke-width="2"/>
<text x="640" y="386" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="15" fill="#1D1D1A" font-weight="bold">{{CONTENT_AREA}}</text>
</g>
<g id="architecture-diagram-node-1">
<line x1="640" y1="334" x2="640" y2="230" stroke="#A3A3A3" stroke-width="1.5"/>
<rect x="560" y="180" width="160" height="50" rx="4" fill="#FAFAFA" stroke="#DEDEDE" stroke-width="1"/>
<text x="640" y="210" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{CONTENT_AREA}}</text>
</g>
<g id="architecture-diagram-node-2">
<line x1="686" y1="380" x2="900" y2="380" stroke="#A3A3A3" stroke-width="1.5"/>
<rect x="900" y="355" width="160" height="50" rx="4" fill="#FAFAFA" stroke="#DEDEDE" stroke-width="1"/>
<text x="980" y="385" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{CONTENT_AREA}}</text>
</g>
<g id="architecture-diagram-node-3">
<line x1="640" y1="426" x2="640" y2="540" stroke="#A3A3A3" stroke-width="1.5"/>
<rect x="560" y="540" width="160" height="50" rx="4" fill="#FAFAFA" stroke="#DEDEDE" stroke-width="1"/>
<text x="640" y="570" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{CONTENT_AREA}}</text>
</g>
<g id="architecture-diagram-node-4">
<line x1="594" y1="380" x2="380" y2="380" stroke="#A3A3A3" stroke-width="1.5"/>
<rect x="220" y="355" width="160" height="50" rx="4" fill="#FAFAFA" stroke="#DEDEDE" stroke-width="1"/>
<text x="300" y="385" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="14" fill="#333333">{{CONTENT_AREA}}</text>
</g>
<g id="results-panel">
<rect x="960" y="450" width="220" height="180" rx="6" fill="#FFF5F5" stroke="#C00000" stroke-width="1"/>
<text x="1070" y="480" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="16" fill="#C00000" font-weight="bold">{{KEY_MESSAGE}}</text>
<text x="1070" y="510" text-anchor="middle" font-family="Arial, &quot;Microsoft YaHei&quot;, sans-serif" font-size="13" fill="#333333">{{CONTENT_AREA}}</text>
</g>
</svg>
