<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1280" height="720" viewBox="0 0 1280 720">
<rect x="0" y="0" width="1280" height="720" fill="#1D1D1A"/>
<g id="shape-title-bar">
<text x="36" y="68" text-anchor="start" xml:space="preserve" font-family="&quot;Arial Black&quot;, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">{{PAGE_TITLE}}</text>
</g>
<g id="shape-kpi-block-1">
<rect x="36" y="120" width="386" height="140" fill="#262626" stroke="#A6A6A6" stroke-width="1"/>
<text x="56" y="148" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="17" fill="#DDDDDD">{{KPI_1_LABEL}}</text>
<text x="56" y="194" text-anchor="start" xml:space="preserve" font-family="&quot;Arial Black&quot;, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFC000">{{KPI_1_VALUE}}</text>
<text x="56" y="222" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="17" fill="#DDDDDD">{{KPI_1_DETAIL_1}}</text>
<text x="56" y="246" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="17" fill="#DDDDDD">{{KPI_1_DETAIL_2}}</text>
</g>
<g id="shape-kpi-block-2">
<rect x="447" y="120" width="386" height="140" fill="#262626" stroke="#A6A6A6" stroke-width="1"/>
<text x="467" y="148" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="17" fill="#DDDDDD">{{KPI_2_LABEL}}</text>
<text x="467" y="194" text-anchor="start" xml:space="preserve" font-family="&quot;Arial Black&quot;, Arial, sans-serif" font-size="28" font-weight="900" fill="#4E9B4E">{{KPI_2_VALUE}}</text>
<text x="467" y="222" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="17" fill="#DDDDDD">{{KPI_2_DETAIL_1}}</text>
<text x="467" y="246" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="17" fill="#DDDDDD">{{KPI_2_DETAIL_2}}</text>
</g>
<g id="shape-kpi-block-3">
<rect x="858" y="120" width="386" height="140" fill="#262626" stroke="#A6A6A6" stroke-width="1"/>
<text x="878" y="148" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="17" fill="#DDDDDD">{{KPI_3_LABEL}}</text>
<text x="878" y="194" text-anchor="start" xml:space="preserve" font-family="&quot;Arial Black&quot;, Arial, sans-serif" font-size="28" font-weight="900" fill="#F4A100">{{KPI_3_VALUE}}</text>
<text x="878" y="222" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="17" fill="#DDDDDD">{{KPI_3_DETAIL_1}}</text>
<text x="878" y="246" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="17" fill="#DDDDDD">{{KPI_3_DETAIL_2}}</text>
</g>
<g id="shape-content-area-left">
<rect x="36" y="290" width="460" height="390" fill="none" stroke="#A6A6A6" stroke-width="0.667"/>
<text x="56" y="316" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="17" fill="#DDDDDD" font-weight="bold">{{CHART_CAPTION}}</text>
<!-- {{CHART_AREA}}: narrow, portrait-oriented visualization slot (~360x270 max).
     Executor fills per this page's page_charts assignment (bar chart / table / bullet chart / kpi cards).
     Example geometry below demonstrates the "prior period (muted gray) vs current period (accent)"
     two-series bar convention and the legend-in-sparse-area rule; replace entirely per actual data. -->
<g id="example_grouped_bar_chart">
<line x1="76" y1="630" x2="436" y2="630" stroke="#A6A6A6" stroke-width="1.5"/>
<rect x="116" y="440" width="45" height="190" fill="#666666"/>
<rect x="171" y="400" width="45" height="230" fill="#FFC000"/>
<text x="166" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#4E9B4E">Metric A +12%</text>
<rect x="296" y="560" width="45" height="70" fill="#666666"/>
<rect x="351" y="540" width="45" height="90" fill="#FFC000"/>
<text x="346" y="655" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#4E9B4E">Metric B +14%</text>
<g id="legend" transform="translate(300,400)">
<rect x="0" y="0" width="12" height="12" fill="#666666"/>
<text x="18" y="11" font-family="Arial, sans-serif" font-size="13" fill="#DDDDDD">Prior period</text>
<rect x="0" y="20" width="12" height="12" fill="#FFC000"/>
<text x="18" y="31" font-family="Arial, sans-serif" font-size="13" fill="#DDDDDD">Current period</text>
</g>
</g>
</g>
<g id="shape-content-area-right">
<rect x="516" y="290" width="728" height="390" fill="#262626" stroke="#A6A6A6" stroke-width="0.667"/>
<text x="536" y="318" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="18" fill="#DDDDDD" font-weight="bold">KEY INITIATIVES</text>
<rect x="536" y="339" width="10" height="10" fill="#FFC000"/>
<text x="558" y="354" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">{{KEY_INITIATIVES_ITEM_1}}</text>
<rect x="536" y="405" width="10" height="10" fill="#4E9B4E"/>
<text x="558" y="420" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">{{KEY_INITIATIVES_ITEM_2}}</text>
<rect x="536" y="471" width="10" height="10" fill="#F4A100"/>
<text x="558" y="486" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">{{KEY_INITIATIVES_ITEM_3}}</text>
<rect x="536" y="537" width="10" height="10" fill="#666666"/>
<text x="558" y="552" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="18" fill="#DDDDDD">{{KEY_INITIATIVES_ITEM_4}}</text>
</g>
<g id="shape-footnote">
<text x="36" y="705" text-anchor="start" xml:space="preserve" font-family="Arial, sans-serif" font-size="16" fill="#666666">{{SOURCE_FOOTNOTE}}</text>
</g>
</svg>
